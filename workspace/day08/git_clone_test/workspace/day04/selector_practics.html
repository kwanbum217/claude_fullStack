<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>selector_practics</title>
    <style>
      /*
       highlight는 클래스이므로, 클래스 선택자를 활용하여 CSS를 적용한다.
       클래스 선택자는 클래스 이름 앞에 점(.)을 붙여서 지칭한다.       
      */
      .highlight {
        color: blue;
        font-weight: bold;
      }

      /* 
      intro는 id이므로, id 선택자를 활용하여 CSS를 적용한다.
      id 선택자는 id 이름 앞에 샵(#)을 붙여서 지칭한다.
      */
      #intro {
        background-color: lightblue;
        padding: 15px;
      }
    </style>
  </head>
  <body>
    <p>첫 번째 문단입니다.</p>
    <!-- 아래의 <p>태그는 class속성이 작성되어있고, 클래스 이름은 highlight라고 적용하였다.-->
    <p class="highlight">두 번째 문단입니다.</p>
    <!-- 아래의 <p>태그는 id속성이 작성되어있고, id 이름은 intro라고 적용하였다.-->
    <p id="intro">세 번째 문단입니다.</p>

    <p class="highlight">똑같은 class이름을 사용하여 작성한 p태그</p>
    <p id="intro">같은 id이름을 사용하여 작성한 p태그</p>
  </body>
</html>
