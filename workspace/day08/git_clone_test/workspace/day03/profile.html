<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>자기소개</title>
    <link
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ── 디자인 토큰 (Claude DESIGN.md 기반) ── */
      :root {
        --primary: #cc785c;
        --primary-active: #a9583e;
        --ink: #141413;
        --body: #3d3d3a;
        --muted: #6c6a64;
        --muted-soft: #8e8b82;
        --hairline: #e6dfd8;
        --canvas: #faf9f5;
        --surface-card: #efe9de;
        --surface-dark: #181715;
        --on-primary: #ffffff;
        --on-dark: #faf9f5;
        --on-dark-soft: #a09d96;

        /* 문서 Typography 섹션에 명시된 폴백 스택 그대로 */
        --font-display: "EB Garamond", "Tiempos Headline", Garamond,
          "Times New Roman", serif;
        --font-body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, sans-serif;

        --rounded-md: 8px;
        --rounded-lg: 12px;
        --rounded-pill: 9999px;

        --space-xs: 8px;
        --space-sm: 12px;
        --space-md: 16px;
        --space-lg: 24px;
        --space-xl: 32px;
        --space-xxl: 48px;
        --space-section: 96px;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background-color: var(--canvas);
        color: var(--body);
        font-family: var(--font-body);
        font-size: 16px; /* typography.body-md */
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
      }

      /* 최대 콘텐츠 폭 1200px 중앙 정렬 */
      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: var(--space-section) var(--space-lg);
      }

      /* ── badge-coral ── */
      .badge {
        display: inline-block;
        background-color: var(--primary);
        color: var(--on-primary);
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 1.5px;
        border-radius: var(--rounded-pill);
        padding: 4px 12px;
        margin-bottom: var(--space-lg);
      }

      /* ── display-xl : 세리프 400 + 음수 자간 ── */
      h1 {
        font-family: var(--font-display);
        font-size: 64px; /* typography.display-xl */
        font-weight: 400; /* 디스플레이는 절대 볼드 금지 */
        line-height: 1.05;
        letter-spacing: -1.5px;
        color: var(--ink);
        margin-bottom: var(--space-md);
      }

      .lead {
        font-size: 18px; /* typography.title-md */
        font-weight: 500;
        line-height: 1.4;
        color: var(--muted);
        margin-bottom: var(--space-xxl);
      }

      /* ── feature-card : 크림 카드 ── */
      .card {
        background-color: var(--surface-card);
        border-radius: var(--rounded-lg);
        padding: var(--space-xl);
      }

      .row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: var(--space-md);
        padding: var(--space-md) 0;
        border-bottom: 1px solid var(--hairline);
      }

      .row:last-child {
        border-bottom: none;
      }

      .row dt {
        flex-shrink: 0;
        font-size: 12px; /* typography.caption-uppercase */
        font-weight: 500;
        line-height: 1.4;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: var(--muted);
      }

      .row dd {
        font-family: var(--font-display);
        font-size: 28px; /* typography.display-sm */
        font-weight: 400;
        line-height: 1.2;
        letter-spacing: -0.3px;
        color: var(--ink);
        word-break: break-all; /* 긴 이메일 주소 대응 */
      }

      /* ── text-link : 코랄 인라인 링크 ── */
      a {
        color: var(--primary);
        text-decoration: none;
      }

      a:active {
        color: var(--primary-active);
        text-decoration: underline;
      }

      /* ── footer : 다크 서피스 ── */
      footer {
        background-color: var(--surface-dark);
        color: var(--on-dark-soft);
        padding: 64px var(--space-lg); /* footer 컴포넌트 규정: 64px */
        text-align: center;
        font-size: 14px; /* typography.body-sm */
      }

      footer strong {
        color: var(--on-dark);
        font-weight: 500;
      }

      /* ── 모바일: h1 64 → 32px ── */
      @media (max-width: 768px) {
        .container {
          padding: var(--space-xxl) var(--space-lg);
        }
        h1 {
          font-size: 32px; /* 문서 규정: 모바일에서 64 → 32px */
          letter-spacing: -0.5px;
        }
        .row {
          flex-direction: column;
          gap: var(--space-xs);
        }
      }
    </style>
  </head>
  <body>
    <main class="container">
      <span class="badge">ABOUT ME</span>
      <h1>안녕하세요,<br />김관범입니다.</h1>
      <p class="lead">배우는 것을 즐기는 웹 개발 지망생입니다.</p>

      <dl class="card">
        <div class="row">
          <dt>이름</dt>
          <dd>김관범</dd>
        </div>
        <div class="row">
          <dt>나이</dt>
          <dd>25세</dd>
        </div>
        <div class="row">
          <dt>이메일</dt>
          <dd><a href="mailto:kwanbum217@gmail.com">kwanbum217@gmail.com</a></dd>
        </div>
        <div class="row">
          <dt>전공</dt>
          <dd>컴퓨터공학</dd>
        </div>
      </dl>
    </main>

    <footer>
      <strong>김관범</strong> · 2026
    </footer>
  </body>
</html>
