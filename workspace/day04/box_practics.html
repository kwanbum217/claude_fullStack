<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>box_practics</title>
    <style>
      .box {
        /* 배경색 지정 */
        background-color: white;
        /* 테두리 선  꾸미기 : 굵기, 선 종류, 선 색상*/
        border: 10px solid blue;
        /* 테두리 선과 내용의 여백 */
        padding: 0;
        /* 또 다른 데이터와의 거리(여백) */
        margin: 30px;
      }
    </style>
  </head>
  <body>
    <div class="box">박스 모델 실습</div>
  </body>
</html>
