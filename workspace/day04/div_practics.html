<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>div_practics</title>
    <style>
      .card {
        background-color: white;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        padding: 20px;
        width: 300px;
      }

      .wrapper {
        display: flex;
        gap: 20px;
        margin-top: 30px;
      }

      .wrapper .card {
        background-color: yellow;
        width: 150px;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>안녕하세요</h1>
      <p>
        자기소개
        <span style="color: red; font-weight: bold">페이지입니다.</span>
      </p>
    </div>

    <div class="wrapper">
      <div class="card">카드1</div>
      <div class="card">카드2</div>
      <div class="card">카드3</div>
    </div>
  </body>
</html>
