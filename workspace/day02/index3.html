<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            font-family: "Malgun Gothic", "맑은 고딕", sans-serif;
        }

        .login-box {
            width: 360px;
            padding: 40px 30px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        h2 {
            margin: 0 0 30px;
            text-align: center;
            color: #333333;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #555555;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #dddddd;
            border-radius: 6px;
            font-size: 14px;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 24px;
        }

        .remember label {
            margin: 0;
            cursor: pointer;
        }

        .btn-area {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
        }

        .btn-login {
            background: #667eea;
            color: #ffffff;
        }

        .btn-login:hover {
            background: #5568d3;
        }

        .btn-reset {
            background: #f0f0f0;
            color: #555555;
        }

        .btn-reset:hover {
            background: #e0e0e0;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>로그인</h2>
        <form action="#" method="post">
            <label for="userid">아이디</label>
            <input type="text" id="userid" name="userid" placeholder="아이디를 입력하세요">

            <label for="userpw">비밀번호</label>
            <input type="password" id="userpw" name="userpw" placeholder="비밀번호를 입력하세요">

            <div class="remember">
                <input type="checkbox" id="remember" name="remember">
                <label for="remember">아이디 저장</label>
            </div>

            <div class="btn-area">
                <button type="submit" class="btn-login">로그인</button>
                <button type="reset" class="btn-reset">취소</button>
            </div>
        </form>
    </div>
</body>
</html>
