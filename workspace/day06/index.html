    <title>day06 JavaScript 기초 - DOM 조작 (textContent vs innerHTML)</title>

  <body>
    <!-- 화면에 표시될 제목 요소 -->

    <!-- 버튼 영역 -->
    <div>
      <!-- textContent 전용 버튼 -->
      <button id="change-btn">textContent로 변경</button>

      <!-- innerHTML 전용 버튼 -->
      <button id="html-btn">innerHTML로 변경</button>
    </div>

    <!-- 자바스크립트 파일 연결 -->

    <script src="fetch연습.js"></script>
