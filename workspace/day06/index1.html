<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Editorial Greeting Generator</title>
  <!-- Google Fonts: Cormorant Garamond (Display Serif) & Inter (Sans-serif) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style1.css">
</head>
<body>
  <div class="page-wrapper">
    <!-- 브랜드 헤더 -->
    <header class="brand-header">
      <div class="brand-logo">
        <svg class="brand-mark" width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M9 0V18M0 9H18M2.636 2.636L15.364 15.364M15.364 2.636L2.636 15.364" stroke="#141413" stroke-width="2.5"/>
        </svg>
        <span class="brand-name">Claude Edition</span>
      </div>
    </header>

    <!-- 히어로 컨텐츠 카드로 이루어진 메인 영역 -->
    <main class="main-container">
      <span class="category-badge">DAILY INSPIRATION</span>
      <h1 class="main-title">생각을 깨우는 인사말</h1>
      <p class="subtitle">버튼을 눌러 오늘의 에디토리얼 인사말을 확인해보세요.</p>

      <!-- 인사말 표시 카드 (Warm Surface Card) -->
      <div class="greeting-card">
        <p id="greeting-display">버튼을 누르면 이곳에 새로운 인사말이 나타납니다.</p>
      </div>

      <!-- 시그니처 코랄 버튼 -->
      <button id="greeting-btn" class="btn-primary">새로운 인사말 뽑기</button>
    </main>
  </div>

  <!-- 자바스크립트 연결 -->
  <script src="script1.js"></script>
</body>
</html>
